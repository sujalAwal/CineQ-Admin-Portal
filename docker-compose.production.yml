version: '3.8'

services:
  cineq-dashboard-production:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: cineq-dashboard-production
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cineq-dashboard-prod.rule=Host(`dashboard.cineq.com`)"
      - "traefik.http.services.cineq-dashboard-prod.loadbalancer.server.port=80"
    networks:
      - cineq-production-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cineq-production-network:
    driver: bridge