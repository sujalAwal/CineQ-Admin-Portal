name: Cine Q Admin Portal Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 🚀 Starting Deployment
        run: echo "Starting the deployment process for Cine Q at $(date)"

      - name: 📥 Checking out code
        uses: actions/checkout@v4

      - name: ⚙️ Setting up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installing Dependencies
        run: |
          echo "::group::npm install logs"
          echo "Running npm install to fetch libraries..."
          npm install
          echo "Dependencies installed successfully."
          echo "::endgroup::"

      - name: 🏗️ Building Angular App
        env:
          # Add your environment variables here if needed
          API_URL: ${{ secrets.API_URL }}
          SUPABASE_STORAGE_BASE_URL: ${{ secrets.SUPABASE_STORAGE_BASE_URL }}
        run: |
          echo "::group::Angular Build Process"
          echo "Building 'cine-q' for Production..."
          npm run build-prod
          echo "Build complete. Checking output directory..."
          echo "::endgroup::"

      - name: 🔍 Verify Build Output
        run: |
          echo "::group::Build Verification"
          echo "📂 Listing dist directory structure:"
          ls -R dist/
          echo ""
          echo "🔍 Checking for browser directory:"
          if [ -d "dist/cineq-admin-portal/browser" ]; then
            echo "✅ Browser directory found!"
            echo ""
            echo "📄 Contents of browser directory:"
            ls -la dist/cineq-admin-portal/browser/
            echo ""
            echo "🔍 Looking for index.html:"
            if [ -f "dist/cineq-admin-portal/browser/index.html" ]; then
              echo "✅ index.html found!"
              echo "📊 File size:"
              ls -lh dist/cineq-admin-portal/browser/index.html
            else
              echo "❌ ERROR: index.html NOT found!"
              exit 1
            fi
          else
            echo "❌ ERROR: Browser directory NOT found!"
            echo "Available directories in dist/cineq-admin-portal/:"
            ls -la dist/cineq-admin-portal/ || echo "dist/cineq-admin-portal/ does not exist"
            echo ""
            echo "Available directories in dist/:"
            ls -la dist/
            exit 1
          fi
          echo "::endgroup::"

      - name: ☁️ Publishing to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'admin-portal-cineq'
          directory: 'dist/cineq-admin-portal/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

      - name: ✅ Deployment Finished
        run: |
          echo "::group::Deployment Summary"
          echo "🎉 Cine Q Admin Portal is now live on Cloudflare Pages!"
          echo "📅 Deployed at: $(date)"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "::endgroup::"

      - name: 🔔 Deployment Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed. Check the logs above for details."
