<div class="m-header">
  <a routerLink="/dashboard" (click)="returnToDashboard($event)" class="b-brand">
    <!-- ========   change your logo hear   ============ -->
    <img src="assets/images/cineq/sidebar.png" alt="darkMode-logo" class="logo"  />
  </a>
  <!-- ======= Menu collapse Icon ===== -->
  <div class="pc-h-item">
      <a
      class="pc-head-link head-link-secondary m-0 mobile-menu"
      [ngClass]="{ on: navCollapsed }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
      title="Click to Menu Collapse"
    >
      <i class="ti ti-menu-2"></i>
    </a>
  </div>
</div>
