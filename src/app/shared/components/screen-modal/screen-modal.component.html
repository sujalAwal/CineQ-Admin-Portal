<app-base-modal [isVisible]="isVisible" [config]="modalConfig" (close)="onModalClose()" (save)="onModalSave()"><div class="form-container"><form [formGroup]="form"><div class="row"><div class="col-md-6"><div class="mb-3"><label class="form-label">Screen Name <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('screenName')" formControlName="screenName" placeholder="Enter screen name"><div class="invalid-feedback" *ngIf="isFieldInvalid('screenName')">{{ getFieldError('screenName') }}</div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label">Theatre <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('theatreId')" formControlName="theatreId" placeholder="Enter theatre ID"><div class="invalid-feedback" *ngIf="isFieldInvalid('theatreId')">{{ getFieldError('theatreId') }}</div></div></div></div><div class="row"><div class="col-md-3"><div class="mb-3"><label class="form-label">Rows <span class="text-danger">*</span></label><input type="number" class="form-control" [class.is-invalid]="isFieldInvalid('rows')" formControlName="rows" placeholder="Rows" min="1" max="50"><div class="invalid-feedback" *ngIf="isFieldInvalid('rows')">{{ getFieldError('rows') }}</div></div></div><div class="col-md-3"><div class="mb-3"><label class="form-label">Columns <span class="text-danger">*</span></label><input type="number" class="form-control" [class.is-invalid]="isFieldInvalid('columns')" formControlName="columns" placeholder="Columns" min="1" max="50"><div class="invalid-feedback" *ngIf="isFieldInvalid('columns')">{{ getFieldError('columns') }}</div></div></div><div class="col-md-3"><div class="mb-3"><label class="form-label">Screen Type <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('screenType')" formControlName="screenType" placeholder="e.g., 2D, 3D"><div class="invalid-feedback" *ngIf="isFieldInvalid('screenType')">{{ getFieldError('screenType') }}</div></div></div><div class="col-md-3"><div class="mb-3"><label class="form-label">Break Time (mins) <span class="text-danger">*</span></label><input type="number" class="form-control" [class.is-invalid]="isFieldInvalid('breakTime')" formControlName="breakTime" placeholder="Break time" min="0" max="60"><div class="invalid-feedback" *ngIf="isFieldInvalid('breakTime')">{{ getFieldError('breakTime') }}</div></div></div></div><div class="row"><div class="col-md-12"><div class="mb-3"><label class="form-label">Sound System</label><input type="text" class="form-control" formControlName="soundSystem" placeholder="e.g., Dolby, 7.1, Stereo"><div class="invalid-feedback" *ngIf="isFieldInvalid('soundSystem')">{{ getFieldError('soundSystem') }}</div></div></div></div><div class="mb-3 form-check form-switch"><input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive"><label class="form-check-label" for="isActive">Active</label></div></form></div></app-base-modal>
