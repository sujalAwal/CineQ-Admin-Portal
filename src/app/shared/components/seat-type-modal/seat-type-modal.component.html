<app-base-modal [isVisible]="isVisible" [config]="modalConfig" (closed)="onModalClose()" (primaryAction)="onModalSave()" (secondaryAction)="onModalClose()"><div class="form-container"><form [formGroup]="form"><div class="row"><div class="col-md-4"><div class="mb-3"><label class="form-label">Code <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('code')" formControlName="code" placeholder="Enter code (1-4 chars)" maxlength="4"><div class="invalid-feedback" *ngIf="isFieldInvalid('code')">{{ getFieldError('code') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Name <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('name')" formControlName="name" placeholder="Enter name"><div class="invalid-feedback" *ngIf="isFieldInvalid('name')">{{ getFieldError('name') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Color <span class="text-danger">*</span></label><div class="d-flex align-items-center gap-2"><input type="color" class="form-control form-control-color" formControlName="color" [class.is-invalid]="isFieldInvalid('color')" title="Choose color"><input type="text" class="form-control" formControlName="color" [class.is-invalid]="isFieldInvalid('color')" placeholder="#000000" maxlength="7"></div><div class="invalid-feedback" *ngIf="isFieldInvalid('color')">{{ getFieldError('color') }}</div></div></div></div><div class="row"><div class="col-md-12"><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" [class.is-invalid]="isFieldInvalid('description')" formControlName="description" placeholder="Enter description" rows="3"></textarea><div class="invalid-feedback" *ngIf="isFieldInvalid('description')">{{ getFieldError('description') }}</div></div></div></div><div class="mb-3 form-check form-switch"><input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive"><label class="form-check-label" for="isActive">Active</label></div></form></div></app-base-modal>
