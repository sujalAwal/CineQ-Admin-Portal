<!-- Setting Group Modal using Base Modal Component -->
<app-base-modal
  [isVisible]="isVisible"
  [config]="modalConfig"
  (closed)="onModalClose()"
  (primaryAction)="onModalSave()">

  <!-- SETTING GROUP FORM CONTENT -->
  <form [formGroup]="settingGroupForm" (ngSubmit)="onModalSave()" novalidate class="setting-group-form">

    <!-- Section: Basic Information -->
    <div class="form-section">

      <div class="row">
        <!-- Title Field -->
        <div class="col-md-6 mb-3">
          <label for="groupTitle" class="form-label">
            Group Title <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            id="groupTitle"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('title')"
            formControlName="title"
            maxlength="150"
            (blur)="generateSlug()">

          <div class="invalid-feedback" *ngIf="isFieldInvalid('title')">
            {{ getFieldError('title') }}
          </div>
          <div class="form-text">
            {{ settingGroupForm.get('title')?.value?.length || 0 }}/150 characters
          </div>
        </div>

        <!-- Slug Field -->
        <div class="col-md-6 mb-3">
          <label for="groupSlug" class="form-label">
            Group Slug <span class="text-danger" *ngIf="!settingGroup">*</span>
          </label>
          <div class="input-group">
            <input
              type="text"
              id="groupSlug"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('slug')"
              formControlName="slug"
              maxlength="100"
              [readonly]="settingGroup">
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="generateSlug()"
              title="Generate from title"
              *ngIf="!settingGroup">
              <i class="ti ti-refresh"></i>
            </button>
          </div>

          <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('slug')">
            {{ getFieldError('slug') }}
          </div>
         
        </div>
      </div>
    </div>

    <!-- Section: Status -->
    <div class="form-section">
      <h6 class="section-title">
        <i class="ti ti-toggle-right me-2"></i>Status
      </h6>

      <div class="form-check form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          id="groupStatus"
          formControlName="isActive">
        <label class="form-check-label" for="groupStatus">
          <span *ngIf="settingGroupForm.get('isActive')?.value" class="text-success">
            <i class="ti ti-check me-1"></i>Active
          </span>
          <span *ngIf="!settingGroupForm.get('isActive')?.value" class="text-muted">
            <i class="ti ti-x me-1"></i>Inactive
          </span>
        </label>
      </div>
    </div>

  </form>
</app-base-modal>
