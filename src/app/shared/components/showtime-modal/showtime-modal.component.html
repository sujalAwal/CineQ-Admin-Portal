<app-base-modal [isVisible]="isVisible" [config]="modalConfig" (close)="onModalClose()" (save)="onModalSave()"><div class="form-container"><form [formGroup]="form"><div class="row"><div class="col-md-6"><div class="mb-3"><label class="form-label">Movie <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('movieId')" formControlName="movieId" placeholder="Enter movie ID"><div class="invalid-feedback" *ngIf="isFieldInvalid('movieId')">{{ getFieldError('movieId') }}</div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label">Screen <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('screenId')" formControlName="screenId" placeholder="Enter screen ID"><div class="invalid-feedback" *ngIf="isFieldInvalid('screenId')">{{ getFieldError('screenId') }}</div></div></div></div><div class="row"><div class="col-md-4"><div class="mb-3"><label class="form-label">Theatre <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('theatreId')" formControlName="theatreId" placeholder="Enter theatre ID"><div class="invalid-feedback" *ngIf="isFieldInvalid('theatreId')">{{ getFieldError('theatreId') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Show Date <span class="text-danger">*</span></label><input type="date" class="form-control" [class.is-invalid]="isFieldInvalid('showDate')" formControlName="showDate"><div class="invalid-feedback" *ngIf="isFieldInvalid('showDate')">{{ getFieldError('showDate') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Show Time <span class="text-danger">*</span></label><input type="time" class="form-control" [class.is-invalid]="isFieldInvalid('showTime')" formControlName="showTime" placeholder="HH:MM"><div class="invalid-feedback" *ngIf="isFieldInvalid('showTime')">{{ getFieldError('showTime') }}</div></div></div></div><div class="row"><div class="col-md-4"><div class="mb-3"><label class="form-label">Language <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('language')" formControlName="language" placeholder="e.g., English"><div class="invalid-feedback" *ngIf="isFieldInvalid('language')">{{ getFieldError('language') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Format <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('format')" formControlName="format" placeholder="e.g., 2D"><div class="invalid-feedback" *ngIf="isFieldInvalid('format')">{{ getFieldError('format') }}</div></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label">Status Code <span class="text-danger">*</span></label><input type="text" class="form-control" [class.is-invalid]="isFieldInvalid('statusCode')" formControlName="statusCode" placeholder="e.g., AV"><div class="invalid-feedback" *ngIf="isFieldInvalid('statusCode')">{{ getFieldError('statusCode') }}</div></div></div></div><div class="row"><div class="col-md-12"><div class="mb-3"><label class="form-label">Base Price <span class="text-danger">*</span></label><input type="number" class="form-control" [class.is-invalid]="isFieldInvalid('basePrice')" formControlName="basePrice" placeholder="Enter base price" min="0" step="0.01"><div class="invalid-feedback" *ngIf="isFieldInvalid('basePrice')">{{ getFieldError('basePrice') }}</div></div></div></div><div class="mb-3 form-check form-switch"><input class="form-check-input" type="checkbox" id="isActive" formControlName="isActive"><label class="form-check-label" for="isActive">Active</label></div></form></div></app-base-modal>
