<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <h5>Artist Types Management</h5>
      </div>
      <div class="card-body">

        <div class="row mb-3">
          <div class="col-md-6">
            <div class="position-relative">
              <input
                type="text"
                class="form-control"
                placeholder="Search artist types..."
                [formControl]="searchControl">
              <i class="ti ti-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
            </div>
          </div>
          <div class="col-md-6 text-end">
            <button class="btn btn-primary" (click)="openAddModal()" [disabled]="loading">
              <i class="ti ti-plus me-2"></i>Add New Type
            </button>
          </div>
        </div>

        <!-- Loading state -->
        <div *ngIf="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="!loading && artistTypes.length === 0" class="text-center py-5">
          <i class="ti ti-users-off text-muted" style="font-size: 3rem;"></i>
          <p class="text-muted mt-2">No artist types found.</p>
          <button class="btn btn-sm btn-primary" (click)="openAddModal()">
            <i class="ti ti-plus me-1"></i>Add First Type
          </button>
        </div>

        <!-- Cards grid -->
        <div class="row" *ngIf="!loading && artistTypes.length > 0">
          <div class="col-lg-4 col-md-6 mb-3" *ngFor="let type of artistTypes; let i = index">
            <div class="card border-0 h-100" [ngClass]="getCardStyle(i).bg">
              <div class="card-body text-center">
                <div class="mb-3">
                  <i [class]="(type.icon || 'ti ti-user') + ' ' + getCardStyle(i).icon" style="font-size: 3rem;"></i>
                </div>
                <h5 class="mb-1">{{ type.name }}</h5>
                <p class="text-muted mb-3 small">{{ type.description || '—' }}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="badge" [ngClass]="getCardStyle(i).badge">
                    {{ type.artist_count ?? 0 }} artists
                  </span>
                  <div>
                    <button
                      class="btn btn-sm me-1"
                      [ngClass]="getCardStyle(i).btn"
                      (click)="editItem(type)"
                      title="Edit">
                      <i class="ti ti-edit"></i>
                    </button>
                    <button
                      class="btn btn-sm btn-outline-danger"
                      (click)="deleteItem(type)"
                      title="Delete">
                      <i class="ti ti-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<app-artist-type-modal
  [isVisible]="showModal"
  [item]="selectedItem"
  [isLoading]="modalLoading"
  (closed)="onModalClosed()"
  (itemSaved)="onItemSaved($event)">
</app-artist-type-modal>

<app-confirmation-modal
  [isVisible]="showConfirmationModal"
  [config]="confirmationConfig"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-confirmation-modal>
