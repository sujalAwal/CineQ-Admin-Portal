<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <h5>⚙️ {{ MODULE_TITLE_PLURAL }} Management</h5>
      </div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-6"></div>
          <div class="col-md-6 text-end">
            <ng-container *appIfModulePermission="'create'">
              <button class="btn btn-primary" (click)="openAddModal()">
                <i class="ti ti-plus me-2"></i>Add New {{ MODULE_TITLE }}
              </button>
            </ng-container>
          </div>
        </div>

        <app-data-table
          [config]="tableConfig"
          [data]="settingsData"
          [loading]="loading"
          [pagination]="pagination"
          (search)="onSearch($event)"
          (pageChange)="onPageChange($event)"
          (sort)="onSort($event)"
          (toggleChange)="onToggleChange($event)"
          (actionClick)="onTableAction($event)"
          (bulkActionClick)="onBulkAction($event)"
          (refresh)="onRefresh()">
        </app-data-table>
      </div>
    </div>
  </div>
</div>

<app-setting-modal
  [isVisible]="showSettingModal"
  [setting]="selectedSetting"
  [isLoading]="modalLoading"
  [settingGroups]="settingGroups"
  [moduleTitle]="MODULE_TITLE"
  (closed)="onModalClosed()"
  (settingSaved)="onSettingSaved($event)">
</app-setting-modal>

<app-confirmation-modal
  [isVisible]="showConfirmationModal"
  [config]="confirmationConfig"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-confirmation-modal>
