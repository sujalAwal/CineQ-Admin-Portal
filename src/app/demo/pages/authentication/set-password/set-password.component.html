<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <a href="#" class="d-flex justify-content-center">
            <img [src]="environment.app.logoUrl" alt="logo" />
          </a>
          <div class="row">
            <div class="d-flex justify-content-center">
              <div class="auth-header">
                <p class="fs-4 mt-2">Set Your Password</p>
              </div>
            </div>
          </div>
          
          <p class="text-center text-muted mb-4">Welcome! Create a secure password to access the admin portal.</p>
          
          <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="form-floating mb-3">
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                formControlName="password"
                [class.is-invalid]="passwordForm.get('password')?.touched && passwordForm.get('password')?.invalid"
                placeholder="New Password" />
              <label for="password">New Password</label>
              <div *ngIf="passwordForm.get('password')?.touched && passwordForm.get('password')?.errors?.['required']" class="invalid-feedback">
                Password is required
              </div>
              <div *ngIf="passwordForm.get('password')?.touched && passwordForm.get('password')?.errors?.['pattern']" class="invalid-feedback">
                At least 8 chars, 1 uppercase, 1 lowercase, 1 number, and 1 special char.
              </div>
            </div>

            <div class="form-floating mb-3">
              <input 
                type="password" 
                class="form-control" 
                id="confirmPassword" 
                formControlName="confirmPassword"
                [class.is-invalid]="passwordForm.get('confirmPassword')?.touched && (passwordForm.get('confirmPassword')?.invalid || passwordForm.hasError('mismatch'))"
                placeholder="Confirm Password" />
              <label for="confirmPassword">Confirm Password</label>
              <div *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.hasError('mismatch')" class="invalid-feedback">
                Passwords do not match
              </div>
            </div>

            <div class="d-grid mt-4">
              <button 
                type="submit" 
                class="btn btn-secondary"
                [disabled]="loading || passwordForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                {{ loading ? 'Setting Password...' : 'Set Password' }}
              </button>
            </div>
          </form>
          
          <hr />
          
          <h5 class="d-flex justify-content-center">
            <a routerLink="/resend-link">Link expired? Request a new one</a>
          </h5>
        </div>
      </div>
    </div>
  </div>
</div>
