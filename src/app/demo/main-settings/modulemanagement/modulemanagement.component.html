<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <h5>📦 Module Management</h5>
      </div>
      <div class="card-body">
        <!-- Header Section -->
        <div class="row mb-3">
          <div class="col-md-6">
            <!-- Left side - can add title or other elements here if needed -->
          </div>
          <div class="col-md-6 text-end">
            <ng-container *appIfModulePermission="'create'">
              <button class="btn btn-primary" (click)="openAddModuleModal()">
                <i class="ti ti-plus me-2"></i>Add New Module
              </button>
            </ng-container>
          </div>
        </div>
        
        <!-- Data Table Component -->
        <app-data-table
          [config]="tableConfig"
          [data]="modulesData"
          [loading]="loading"
          [pagination]="pagination"
          (search)="onSearch($event)"
          (pageChange)="onPageChange($event)"
          (sort)="onSort($event)"
          (toggleChange)="onToggleChange($event)"
          (actionClick)="onTableAction($event)"
          (bulkActionClick)="onBulkAction($event)">
        </app-data-table>
      </div>
    </div>
  </div>
</div>

<!-- Module Modal -->
<app-module-modal
  [isVisible]="showModuleModal"
  [module]="selectedModule"
  [parentModules]="parentModules"
  [isLoading]="modalLoading"
  (closed)="onModuleModalClosed()"
  (moduleSaved)="onModuleSaved($event)">
</app-module-modal>

<!-- Confirmation Modal -->
<app-confirmation-modal
  [isVisible]="showConfirmationModal"
  [config]="confirmationConfig"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-confirmation-modal>
